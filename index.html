<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241839">
  <title>J &amp; P · Nuestra historia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #321d3b;
      --wine: #762f58;
      --gold: #c9a978;
      --paper: #f5ead7;
      --plum: #241839;
      --rose: #eea2bd;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --display: 'Cinzel Decorative', Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--paper);
      background-color: #1b1129;
      background-image: radial-gradient(ellipse at 50% 40%, rgba(119, 71, 103, .34), transparent 58%), repeating-linear-gradient(125deg, transparent 0 42px, rgba(233, 193, 145, .025) 43px 44px);
      font-family: var(--serif);
    }
    .scene { width: min(100%, 1020px); padding: 46px 24px 30px; text-align: center; }
    .prelude { margin: 0 0 10px; color: #e6b781; font-family: var(--display); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 0 0 36px; font-family: var(--display); font-size: clamp(24px, 4vw, 38px); font-weight: 400; }
    h1 span { color: var(--rose); }
    .book-wrap { perspective: 1800px; width: min(100%, 760px); margin: 0 auto; }
    .book {
      position: relative;
      width: 100%;
      aspect-ratio: 1.62;
      min-height: 310px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transform-style: preserve-3d;
      filter: drop-shadow(0 26px 26px rgba(0, 0, 0, .34));
    }
    .book:focus-visible { outline: 3px solid #e6b781; outline-offset: 8px; }
    @media (hover: hover) {
      .book:not(.is-opening):hover .cover-face { filter: brightness(1.12); }
    }
    .pages {
      position: absolute;
      inset: 3% 2.5% 3% 2.5%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--gold);
      box-shadow: inset 0 0 0 8px rgba(201, 169, 120, .16), inset 0 0 30px rgba(80, 48, 57, .12);
    }
    .pages::before { position: absolute; z-index: 1; inset: 0 auto 0 50%; width: 1px; background: rgba(99, 60, 67, .25); content: ''; }
    .book-cover {
      position: absolute;
      z-index: 3;
      inset: 0 0 0 0;
      transform: rotateY(0);
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 700ms cubic-bezier(.2, .72, .18, 1);
    }
    .cover-face, .cover-inside { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; backface-visibility: hidden; border: 1px solid var(--gold); }
    .cover-face {
      overflow: hidden;
      color: var(--paper);
      background: radial-gradient(ellipse at 50% 38%, #62334e, transparent 56%), repeating-linear-gradient(135deg, transparent 0 13px, rgba(231, 195, 141, .045) 14px 15px), #39223f;
      box-shadow: inset 0 0 0 9px rgba(201, 169, 120, .22), inset 0 0 0 11px rgba(201, 169, 120, .18);
    }
    .cover-face::before, .cover-face::after { position: absolute; width: 42px; height: 42px; border: 1px solid rgba(201, 169, 120, .75); content: ''; transform: rotate(45deg); }
    .cover-face::before { top: 10%; left: 7%; }
    .cover-face::after { right: 7%; bottom: 10%; }
    .cover-emblem { display: grid; place-items: center; width: clamp(90px, 18vw, 145px); aspect-ratio: 1; margin-bottom: 18px; border: 1px solid var(--gold); border-radius: 50%; color: #f0c5a4; font-family: var(--display); font-size: clamp(25px, 5vw, 40px); box-shadow: 0 0 0 8px rgba(201, 169, 120, .08), inset 0 0 24px rgba(201, 169, 120, .12); }
    .cover-title { margin: 0; font-family: var(--display); font-size: clamp(18px, 3.6vw, 30px); font-weight: 400; letter-spacing: .1em; }
    .cover-subtitle { margin: 12px 0 0; color: #ead2bd; font-size: clamp(17px, 2.8vw, 23px); font-style: italic; }
    .cover-inside { transform: rotateY(180deg); color: var(--wine); background: repeating-linear-gradient(0deg, transparent 0 25px, rgba(111, 76, 80, .05) 26px 27px), #e9dac4; box-shadow: inset 0 0 0 8px rgba(201, 169, 120, .2); }
    .cover-inside span { font-family: var(--display); font-size: clamp(26px, 4vw, 38px); }
    .scene { transition: opacity 700ms ease; }
    .book-wrap { transition: transform 1100ms cubic-bezier(.2, .72, .18, 1); transform-origin: center; }
    .scene.is-opening { opacity: 0; transition-delay: 400ms; }
    .scene.is-opening .book-wrap { transform: scale(2.5); }
    .book.is-opening .book-cover { transform: rotateY(-175deg); }
    @media (max-width: 560px) {
      .scene { padding: 34px 16px 24px; }
      h1 { margin-bottom: 28px; }
      .book { min-height: 285px; aspect-ratio: .94; }
      .pages { inset: 2% 2% 2%; }
      .cover-emblem { width: 86px; }
      .cover-face::before, .cover-face::after { width: 28px; height: 28px; }
      .scene.is-opening .book-wrap { transform: scale(2.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <p class="prelude">Un relato de J &amp; P</p>
    <h1>Nuestra <span>historia</span></h1>

    <div class="book-wrap">
      <div class="book" id="book" role="button" tabindex="0" aria-label="Abrir libro y ver nuestra historia">
        <div class="pages" aria-hidden="true"></div>
        <div class="book-cover" aria-hidden="true">
          <div class="cover-face">
            <span class="cover-emblem">J &amp; P</span>
            <p class="cover-title">Nuestra historia</p>
          </div>
          <div class="cover-inside"><span>J &amp; P</span></div>
        </div>
      </div>
    </div>

  </main>
  <script>
    const book = document.getElementById('book');
    function openStory() {
      if (book.classList.contains('is-opening')) return;

      book.classList.add('is-opening');
      book.setAttribute('aria-disabled', 'true');
      document.querySelector('.scene').classList.add('is-opening');

      const delay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1150;
      window.setTimeout(() => {
        window.location.href = 'historia.html';
      }, delay);
    }

    book.addEventListener('click', openStory);
    book.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openStory();
      }
    });
  </script>
</body>
</html>
